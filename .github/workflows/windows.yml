name: Windows runtime checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared dependencies
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m src.worktrace.cli --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from src.worktrace import preflight, vision; from src.worktrace.analyzers import online"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline runtime and installer regression tests
        run: >-
          python -m pytest -q
          tests/integration/test_cli_contract.py
          tests/integration/test_cli_utf8.py
          tests/integration/test_cli_setup.py
          tests/integration/test_install_scripts.py
          tests/unit/test_commands.py
          tests/unit/test_codex_analyzer.py
          tests/unit/test_codex_config_import.py
          tests/unit/test_preflight.py
          tests/unit/test_full_preflight.py
          tests/unit/test_runtime_progress.py
          tests/unit/test_docs_contract.py
          --tb=short --show-capture=no
